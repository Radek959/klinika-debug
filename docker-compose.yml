services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_password
      MYSQL_DATABASE: klinika_debug
      MYSQL_USER: klinika
      MYSQL_PASSWORD: klinika_local_password
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_password
      MYSQL_DATABASE: klinika_debug_test
      MYSQL_USER: klinika
      MYSQL_PASSWORD: klinika_local_password
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
